<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY LITTLE OCEAN</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08788a;color:#efffff;font-family:system-ui,"Noto Sans KR",sans-serif}canvas{display:block}
#intro{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:linear-gradient(#164d5b55,#032b40bb);backdrop-filter:blur(3px)}
.panel{width:min(520px,calc(100% - 32px));padding:34px 28px;text-align:center;border:1px solid #dfffff55;border-radius:24px;background:#073c4bc9;box-shadow:0 20px 80px #00233188}
small{letter-spacing:.25em;color:#b4ece2;font-weight:700}h1{font-size:clamp(30px,7vw,46px);line-height:1.1;margin:15px 0 5px}h1 span{display:block;font-size:14px;letter-spacing:.25em;font-weight:500;margin-top:12px;color:#bcebe8}
p{font-size:14px;line-height:1.9;color:#d7f3f0;margin:22px 0}button{border:0;border-radius:30px;padding:13px 24px;background:#d5fff1;color:#075166;font-weight:800;cursor:pointer}
.hint{font-size:11px;color:#b5dada;line-height:1.8;margin-top:17px}
#hud{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;text-shadow:0 2px 12px #003344}#brand{position:absolute;top:22px;left:24px;font-size:10px;letter-spacing:.2em}#brand b{display:block;font-size:14px;margin-top:5px}
#depth{position:absolute;right:24px;top:22px;text-align:right;font-size:10px;letter-spacing:.15em}#depth strong{display:block;font-size:20px;margin-top:4px}
#bottom{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap}
#sound{position:absolute;right:18px;bottom:16px;pointer-events:auto;background:#073c4b99;color:white;border:1px solid #dfffff55;padding:9px 13px;font-size:11px}
#cross{position:absolute;left:50%;top:50%;width:5px;height:5px;border:1px solid #fff9;border-radius:50%;transform:translate(-50%,-50%)}
</style></head><body>
<div id="intro"><div class="panel"><small>A QUIET PLACE TO KEEP SWIMMING</small><h1>MY LITTLE OCEAN<span>SHO'S ENDLESS SWIM</span></h1><p>파도 위에서 숨을 고르고,<br>햇살이 내려앉은 바닷속으로 천천히 들어가 보세요.<br>여기는 당신만의 작은 바다입니다.</p><button id="start">바다로 들어가기</button><div class="hint">W A S D 이동 · 마우스 시선 · SPACE 수면 위/아래<br>SHIFT 빠르게 유영 · ESC 마우스 해제</div></div></div>
<div id="hud"><div id="brand">SHO'S ENDLESS SWIM<b>MY LITTLE OCEAN</b></div><div id="depth">OCEAN DEPTH<strong id="depthv">SURFACE</strong></div><div id="cross"></div><div id="bottom">WASD 이동　·　마우스 시선　·　SPACE 잠수　·　SHIFT 가속</div><button id="sound">♪ 사운드 켜기</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bd8d6);scene.fog=new THREE.FogExp2(0x63b9bc,.009);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,600);camera.position.set(0,2.2,18);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xcfffff,0x174d49,1.8));const sun=new THREE.DirectionalLight(0xfff0c8,2.6);sun.position.set(-40,75,25);scene.add(sun);const fill=new THREE.DirectionalLight(0x4bd5d0,.8);fill.position.set(35,20,-35);scene.add(fill);
const waterGeo=new THREE.PlaneGeometry(500,500,140,140);waterGeo.rotateX(-Math.PI/2);
const waterMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{time:{value:0},col:{value:new THREE.Color(0x20bcb4)}},vertexShader:`uniform float time;varying vec3 wp;void main(){vec3 p=position;p.y+=sin(p.x*.07+time)*.17+cos(p.z*.08-time*.8)*.13;vec4 w=modelMatrix*vec4(p,1.);wp=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,fragmentShader:`uniform vec3 col;uniform float time;varying vec3 wp;void main(){float s=pow(max(0.,sin(wp.x*.2+time)*cos(wp.z*.18-time)),9.);gl_FragColor=vec4(col+vec3(.3,.45,.36)*s*.4,.78);}`});
const water=new THREE.Mesh(waterGeo,waterMat);scene.add(water);
const fg=new THREE.PlaneGeometry(500,500,100,100);fg.rotateX(-Math.PI/2);const a=fg.attributes.position;for(let i=0;i<a.count;i++){let x=a.getX(i),z=a.getZ(i);a.setY(i,Math.sin(x*.025)*1.3+Math.cos(z*.03)*1.1+Math.sin((x+z)*.02));}fg.computeVertexNormals();const floor=new THREE.Mesh(fg,new THREE.MeshStandardMaterial({color:0xc8b98e,roughness:1}));floor.position.y=-16;scene.add(floor);
function island(x,z,sx,sy,sz){let g=new THREE.Group();g.position.set(x,0,z);scene.add(g);let m=new THREE.Mesh(new THREE.SphereGeometry(1,28,18),new THREE.MeshStandardMaterial({color:0xb9aa82}));m.scale.set(sx,sy,sz);m.position.y=-1;g.add(m);let hill=new THREE.Mesh(new THREE.ConeGeometry(sx*.6,sy*1.4,9),new THREE.MeshStandardMaterial({color:0x477a59}));hill.position.y=sy*.4;hill.scale.z=sz/sx;g.add(hill);for(let i=0;i<13;i++){let t=i*2.4,tree=new THREE.Group();tree.position.set(Math.cos(t)*sx*.55,sy*.7,Math.sin(t)*sz*.55);g.add(tree);let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.04,.07,1.4,6),new THREE.MeshStandardMaterial({color:0x76563d}));trunk.rotation.z=-.25;tree.add(trunk);let crown=new THREE.Mesh(new THREE.SphereGeometry(.55,8,6),new THREE.MeshStandardMaterial({color:0x287451}));crown.scale.set(1.4,.5,.9);crown.position.set(.15,.85,0);tree.add(crown);}}
island(-65,-105,28,14,22);island(72,-125,37,16,25);island(0,-185,48,18,32);
const rockmat=new THREE.MeshStandardMaterial({color:0x587568,roughness:1}),corals=[0xf18d79,0xe9b76d,0xb47ac3,0x55b8aa,0xe6d18b].map(c=>new THREE.MeshStandardMaterial({color:c}));
const kelps=[];for(let i=0;i<145;i++){let ang=Math.random()*6.28,r=7+Math.random()*92,x=Math.cos(ang)*r,z=Math.sin(ang)*r-12;let rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.8+Math.random()*1.8,1),rockmat);rock.position.set(x,-15,z);rock.scale.set(1,.65,1.25);scene.add(rock);if(i%2===0){let group=new THREE.Group();group.position.set(x,-15,z);scene.add(group);let mat=corals[i%5];for(let j=0;j<7;j++){let h=.7+Math.random()*1.4,stem=new THREE.Mesh(new THREE.CylinderGeometry(.045,.11,h,7),mat);let q=j/7*6.28;stem.position.set(Math.cos(q)*.25,h/2,Math.sin(q)*.25);stem.rotation.z=(Math.random()-.5)*.5;group.add(stem);}}if(i%3===0){let mesh=new THREE.Mesh(new THREE.PlaneGeometry(.55,3+Math.random()*3,2,8),new THREE.MeshStandardMaterial({color:0x267d69,side:THREE.DoubleSide}));mesh.position.set(x,-12,z);scene.add(mesh);kelps.push({mesh,phase:Math.random()*6});}}
const shafts=[];for(let i=0;i<17;i++){let m=new THREE.Mesh(new THREE.CylinderGeometry(.3,3,34,8,1,true),new THREE.MeshBasicMaterial({color:0xd8fff0,transparent:true,opacity:.04,depthWrite:false,side:THREE.DoubleSide}));m.position.set(-30+i*4,-4,-35-(i%4)*8);m.rotation.z=(i%5-2)*.05;scene.add(m);shafts.push(m);}
const fish=[],fishm=[0xffd58b,0x72d7c9,0xf1a58d,0xd8eee0].map(c=>new THREE.MeshStandardMaterial({color:c}));for(let s=0;s<9;s++){let center=new THREE.Vector3((Math.random()-.5)*75,-5-Math.random()*7,-25+(Math.random()-.5)*65);for(let j=0;j<13;j++){let g=new THREE.Group(),mat=fishm[s%4],body=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),mat);body.scale.set(1.7,.65,.55);g.add(body);let tail=new THREE.Mesh(new THREE.ConeGeometry(.14,.32,5),mat);tail.rotation.z=-Math.PI/2;tail.position.x=-.4;g.add(tail);let off=new THREE.Vector3((Math.random()-.5)*7,(Math.random()-.5)*3,(Math.random()-.5)*7);g.position.copy(center).add(off);scene.add(g);fish.push({g,center,off,phase:Math.random()*6.28,speed:.3+Math.random()*.4});}}
const bubbles=[];for(let i=0;i<48;i++){let b=new THREE.Mesh(new THREE.SphereGeometry(.04+Math.random()*.07,8,8),new THREE.MeshBasicMaterial({color:0xdfffff,transparent:true,opacity:.45}));b.position.set((Math.random()-.5)*45,-2-Math.random()*13,(Math.random()-.5)*55);scene.add(b);bubbles.push({b,speed:.4+Math.random()*.8,phase:Math.random()*6});}
const moteGeo=new THREE.BufferGeometry(),N=700,pos=new Float32Array(N*3);for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*150;pos[i*3+1]=-14+Math.random()*13;pos[i*3+2]=(Math.random()-.5)*150;}moteGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));scene.add(new THREE.Points(moteGeo,new THREE.PointsMaterial({color:0xe2fff3,size:.09,transparent:true,opacity:.5,depthWrite:false})));
let yaw=0,pitch=0,under=false,locked=false,started=false;const keys={},vel=new THREE.Vector3(),clock=new THREE.Clock();
function dive(v){under=v;camera.position.y=v?-4.2:2.2;scene.fog.color.set(v?0x0c7183:0x63b9bc);scene.fog.density=v?.018:.009;waterMat.uniforms.col.value.set(v?0x168e91:0x20bcb4);document.getElementById('depthv').textContent=v?'4.2 M · BELOW':'SURFACE';}
document.getElementById('start').onclick=()=>{started=true;document.getElementById('intro').style.opacity=0;setTimeout(()=>document.getElementById('intro').remove(),850);document.getElementById('hud').style.opacity=1;renderer.domElement.requestPointerLock?.();};
document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);
document.addEventListener('mousemove',e=>{if(locked){yaw-=e.movementX*.0022;pitch=THREE.MathUtils.clamp(pitch-e.movementY*.0018,-1.2,1.2);}});
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'&&started&&!e.repeat){dive(!under);e.preventDefault();}});document.addEventListener('keyup',e=>keys[e.code]=false);
renderer.domElement.addEventListener('click',()=>{if(started&&!locked)renderer.domElement.requestPointerLock?.();});
let ctx,master,sound=false;document.getElementById('sound').onclick=()=>{if(!ctx){ctx=new AudioContext();master=ctx.createGain();master.connect(ctx.destination);master.gain.value=0;let buf=ctx.createBuffer(1,ctx.sampleRate*3,ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.2;let src=ctx.createBufferSource();src.buffer=buf;src.loop=true;let f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=480;let g=ctx.createGain();g.gain.value=.24;src.connect(f);f.connect(g);g.connect(master);src.start();}sound=!sound;ctx.resume();master.gain.setTargetAtTime(sound?.55:0,ctx.currentTime,.7);document.getElementById('sound').textContent=sound?'♪ 사운드 끄기':'♪ 사운드 켜기';};
function loop(){requestAnimationFrame(loop);let t=clock.getElapsedTime(),dt=Math.min(clock.getDelta(),.04);waterMat.uniforms.time.value=t;water.position.x=camera.position.x*.12;water.position.z=camera.position.z*.12;
for(let f of fish){let a=t*f.speed*.35+f.phase;f.g.position.set(f.center.x+f.off.x+Math.sin(a)*1.8,f.center.y+f.off.y+Math.sin(a*1.7)*.5,f.center.z+f.off.z+Math.cos(a)*1.8);f.g.rotation.y=a+Math.PI/2;}
for(let b of bubbles){b.b.position.y+=b.speed*dt;if(b.b.position.y>0)b.b.position.y=-15-Math.random()*4;b.b.position.x+=Math.sin(t+b.phase)*dt*.12;}
for(let k of kelps)k.mesh.rotation.z=Math.sin(t*.8+k.phase)*.08;for(let s of shafts)s.material.opacity=.03+Math.sin(t*.7+s.position.x)*.012;
if(started){let fwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)),wish=new THREE.Vector3();if(keys.KeyW||keys.ArrowUp)wish.add(fwd);if(keys.KeyS||keys.ArrowDown)wish.sub(fwd);if(keys.KeyD||keys.ArrowRight)wish.add(right);if(keys.KeyA||keys.ArrowLeft)wish.sub(right);if(keys.KeyE)wish.y++;if(keys.KeyQ)wish.y--;if(wish.lengthSq())wish.normalize();vel.lerp(wish.multiplyScalar(keys.ShiftLeft||keys.ShiftRight?12:6),1-Math.exp(-3.8*dt));camera.position.addScaledVector(vel,dt);camera.position.x=THREE.MathUtils.clamp(camera.position.x,-105,105);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-190,85);if(!under)camera.position.y=THREE.MathUtils.lerp(camera.position.y,2.2,1-Math.exp(-5*dt));else camera.position.y=THREE.MathUtils.clamp(camera.position.y,-12,-.8);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;document.getElementById('depthv').textContent=under?`${Math.abs(camera.position.y).toFixed(1)} M · BELOW`:'SURFACE';}
renderer.render(scene,camera);}
loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));});
</script></body></html>
